<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="A five-second animated intro for the srirasane-sudo/1 GitHub repository.">
  <title>srirasane-sudo/1 — Repository Intro</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b14;
      color: #f3f6fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #8d99ad;
      --line: rgba(165, 190, 228, .14);
      --blue: #59a8ff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100svh; overflow: hidden; }
    button { font: inherit; }

    .stage {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(23, 67, 128, .25), transparent 43%),
        radial-gradient(ellipse at 50% 100%, rgba(20, 49, 91, .16), transparent 50%),
        #070b14;
    }
    .stage::before {
      position: absolute;
      z-index: -2;
      inset: -35%;
      background: conic-gradient(from 220deg at 50% 50%, transparent 0 24%, rgba(40, 116, 218, .075) 30%, transparent 38% 65%, rgba(44, 91, 166, .07) 72%, transparent 82%);
      content: "";
      animation: ambient-turn 28s linear infinite;
    }
    .stage::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: linear-gradient(rgba(138, 177, 229, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(138, 177, 229, .025) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: radial-gradient(ellipse at center, #000 4%, transparent 77%);
      content: "";
    }

    .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #83bdff;
      opacity: 0;
      box-shadow: 0 0 12px 2px rgba(83, 163, 255, .55);
      animation: drift 5.8s ease-in-out infinite;
    }
    .particle:nth-child(1) { left: 12%; top: 27%; animation-delay: .2s; }
    .particle:nth-child(2) { left: 78%; top: 18%; animation-delay: 1.1s; }
    .particle:nth-child(3) { left: 88%; top: 68%; animation-delay: 2.3s; }
    .particle:nth-child(4) { left: 23%; top: 77%; animation-delay: 3s; }
    .particle:nth-child(5) { left: 66%; top: 83%; animation-delay: .7s; }
    .particle:nth-child(6) { left: 39%; top: 12%; animation-delay: 1.8s; }
    .particle:nth-child(7) { left: 7%; top: 58%; animation-delay: 2.8s; }
    .particle:nth-child(8) { left: 93%; top: 39%; animation-delay: 1.4s; }

    .scene { position: relative; width: min(100% - 40px, 760px); padding: 48px 0 72px; }
    .eyebrow {
      position: absolute;
      top: 0;
      left: 50%;
      color: #7f91ac;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .24em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 8px);
      animation: eyebrow-in .65s .15s ease-out forwards;
    }
    .card {
      overflow: hidden;
      border: 1px solid rgba(164, 190, 229, .18);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(17, 26, 42, .97), rgba(11, 17, 29, .97));
      box-shadow: 0 30px 100px rgba(0, 0, 0, .48), 0 0 75px rgba(35, 119, 222, .1), inset 0 1px rgba(255,255,255,.035);
      opacity: 0;
      transform: translateY(28px) scale(.965);
      animation: card-in .85s .45s cubic-bezier(.2,.8,.2,1) forwards, gentle-float 6s 1.4s ease-in-out infinite;
    }
    .repo-head { display: flex; align-items: center; gap: 16px; padding: 26px 30px 23px; }
    .avatar {
      position: relative;
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(113, 177, 255, .48);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 27%, #69bbff, #2366bd 48%, #102649 78%);
      box-shadow: 0 0 24px rgba(49, 137, 245, .24);
    }
    .avatar::before, .avatar::after { position: absolute; content: ""; border: 1px solid rgba(221,240,255,.62); border-radius: 50%; }
    .avatar::before { width: 22px; height: 22px; transform: translate(-5px, -1px); }
    .avatar::after { width: 22px; height: 22px; transform: translate(5px, 4px); opacity: .7; }
    .repo-meta { min-width: 0; }
    .repo-name { margin: 0; color: #f4f7fc; font-size: clamp(20px, 4vw, 27px); font-weight: 650; letter-spacing: -.045em; }
    .repo-name span { color: #9eacc1; font-weight: 450; }
    .repo-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .public-tag { margin-left: auto; padding: 4px 10px; border: 1px solid rgba(149, 169, 197, .23); border-radius: 999px; color: #a7b3c5; font-size: 11px; }
    .rule { height: 1px; background: var(--line); }
    .branch-row { display: flex; align-items: center; justify-content: space-between; padding: 17px 30px; }
    .branch-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid rgba(143, 166, 199, .2); border-radius: 7px; color: #c5d0df; font-size: 12px; }
    .branch-icon { width: 13px; height: 13px; color: #8ea6c4; }
    .branch-caption { color: #77869b; font-size: 12px; }
    .empty-state { display: flex; align-items: center; gap: 19px; min-height: 128px; margin: 0 20px; padding: 23px 10px; border-top: 1px solid rgba(165,190,228,.1); }
    .empty-icon { display: grid; width: 50px; height: 50px; flex: 0 0 auto; place-items: center; border: 1px solid rgba(94, 164, 249, .2); border-radius: 14px; background: rgba(44, 112, 198, .1); color: #72b4ff; }
    .empty-icon svg { width: 25px; height: 25px; }
    .empty-copy h2 { margin: 0; color: #e8edf5; font-size: 15px; font-weight: 580; letter-spacing: -.01em; }
    .empty-copy p { margin: 6px 0 0; color: #8997aa; font-size: 13px; }
    .size { margin-left: auto; color: #8694a8; font-size: 12px; white-space: nowrap; }
    .language-panel {
      margin: 0 20px 20px;
      padding: 18px 20px;
      border: 1px solid rgba(143, 170, 207, .14);
      border-radius: 11px;
      background: rgba(6, 11, 20, .45);
      opacity: 0;
      transform: translateY(10px);
      animation: panel-in .65s 2.75s ease-out forwards;
    }
    .language-heading { display: flex; align-items: center; gap: 9px; color: #dce5f1; font-size: 13px; font-weight: 600; }
    .language-heading svg { width: 15px; height: 15px; color: #88a6cb; }
    .language-empty { display: flex; align-items: center; gap: 10px; margin-top: 17px; color: #7f8da1; font-size: 12px; }
    .language-empty::before { width: 100%; max-width: 150px; height: 4px; border-radius: 9px; background: rgba(132, 155, 188, .12); content: ""; }
    .finale {
      position: absolute;
      top: calc(100% + 24px);
      left: 50%;
      width: min(92vw, 650px);
      margin: 0;
      color: #f2f6fc;
      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 500;
      letter-spacing: .005em;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      animation: finale-in .7s 3.85s ease-out forwards;
    }
    .controls { position: absolute; right: 0; bottom: 0; left: 0; display: flex; justify-content: center; opacity: 0; animation: controls-in .6s 4.65s ease-out forwards; }
    .replay {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid rgba(153, 177, 209, .2);
      border-radius: 999px;
      background: rgba(13, 20, 33, .72);
      color: #aab8cb;
      cursor: pointer;
      font-size: 11px;
      transition: border-color .2s, color .2s, background .2s;
    }
    .replay:hover { border-color: rgba(110, 173, 255, .55); background: rgba(22, 38, 60, .85); color: #e7f2ff; }
    .replay svg { width: 13px; height: 13px; }
    .timeline { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; background: rgba(116, 145, 183, .12); }
    .timeline::after { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #3278d0, #82c5ff); content: ""; transform: scaleX(0); transform-origin: left; animation: progress 5s linear forwards; }

    @keyframes ambient-turn { to { transform: rotate(360deg); } }
    @keyframes drift { 0%, 100% { opacity: 0; transform: translate3d(0, 12px, 0); } 25%, 70% { opacity: .58; } 50% { opacity: .18; transform: translate3d(12px, -18px, 0); } }
    @keyframes eyebrow-in { to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes card-in { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes gentle-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
    @keyframes panel-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes finale-in { to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes controls-in { to { opacity: 1; } }
    @keyframes progress { to { transform: scaleX(1); } }

    .stage.replaying .eyebrow, .stage.replaying .card, .stage.replaying .language-panel,
    .stage.replaying .finale, .stage.replaying .controls, .stage.replaying .timeline::after { animation: none; }
    .stage.replaying .eyebrow { opacity: 0; transform: translate(-50%, 8px); }
    .stage.replaying .card { opacity: 0; transform: translateY(28px) scale(.965); translate: none; }
    .stage.replaying .language-panel { opacity: 0; transform: translateY(10px); }
    .stage.replaying .finale { opacity: 0; transform: translate(-50%, 8px); }
    .stage.replaying .controls { opacity: 0; }
    .stage.replaying .timeline::after { transform: scaleX(0); }

    @media (max-width: 540px) {
      .scene { width: min(100% - 28px, 760px); padding-top: 42px; padding-bottom: 70px; }
      .repo-head { gap: 12px; padding: 21px 18px; }
      .avatar { width: 42px; height: 42px; }
      .repo-subtitle { font-size: 12px; }
      .public-tag { padding: 4px 8px; font-size: 10px; }
      .branch-row { padding: 14px 18px; }
      .empty-state { gap: 13px; margin: 0 12px; min-height: 112px; }
      .empty-icon { width: 43px; height: 43px; }
      .empty-copy p { max-width: 195px; font-size: 12px; }
      .size { font-size: 11px; }
      .language-panel { margin: 0 12px 12px; padding: 16px; }
      .finale { top: calc(100% + 18px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Five-second animated repository intro">
    <div class="particles" aria-hidden="true">
      <i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i>
      <i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i>
    </div>
    <section class="scene" aria-label="Repository information">
      <div class="eyebrow">A new repository</div>
      <article class="card">
        <header class="repo-head">
          <div class="avatar" aria-hidden="true"></div>
          <div class="repo-meta">
            <h1 class="repo-name"><span>srirasane-sudo</span> / 1</h1>
            <p class="repo-subtitle">A fresh start for something new.</p>
          </div>
          <span class="public-tag">Public</span>
        </header>
        <div class="rule"></div>
        <div class="branch-row">
          <span class="branch-badge">
            <svg class="branch-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="5" cy="3" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="13" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="3" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 5v3a5 5 0 0 0 5 5M11 5v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            main
          </span>
          <span class="branch-caption">Default branch</span>
        </div>
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h6l2 2h8v8.8A1.7 1.7 0 0 1 18.3 20H5.7A1.7 1.7 0 0 1 4 18.3V7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.3 9.5h15.4" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
          <div class="empty-copy">
            <h2>No files yet</h2>
            <p>This repository is ready for its first commit.</p>
          </div>
          <span class="size">0 KB</span>
        </div>
        <section class="language-panel" aria-label="Language composition">
          <div class="language-heading">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5h12M5 2v1.5m6-1.5v1.5M3 6.5h10M4 9.5h8M5 12.5h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Languages
          </div>
          <div class="language-empty">No languages detected</div>
        </section>
      </article>
      <p class="finale">Repository is empty — no code yet, no language composition detected.</p>
      <div class="controls">
        <button class="replay" id="replay" type="button" aria-label="Replay animation">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 5.5A5.5 5.5 0 1 0 13.4 9M13 2.5v3.8H9.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Replay intro
        </button>
      </div>
    </section>
    <div class="timeline" aria-hidden="true"></div>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const replay = document.getElementById('replay');
    replay.addEventListener('click', () => {
      stage.classList.add('replaying');
      void stage.offsetWidth;
      stage.classList.remove('replaying');
    });
  </script>
</body>
</html>
